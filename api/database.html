<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Shift — Database</title>
<style>
  :root { --bg:#0f1624; --panel:#1a2436; --text:#eff4ff; --accent:#82cdff; --muted:#8fa3c4;
          --gold:#ffdc4a; --silver:#cdd4e1; --bronze:#d69660; --err:#ff7878; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family: "Trebuchet MS", system-ui, sans-serif; padding:32px 16px; }
  main { max-width:1000px; margin:0 auto; }
  h1 { text-align:center; letter-spacing:.12em; margin:0 0 4px; font-size:2.2rem; }
  .sub { text-align:center; color:var(--accent); margin:0 0 24px; }
  .panel { background:var(--panel); border:2px solid #2b3a57; border-radius:10px; padding:8px 16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:12px 10px; text-align:left; white-space:nowrap; }
  th { color:var(--accent); font-weight:600; border-bottom:2px solid #2b3a57; }
  td { border-bottom:1px solid #243149; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; }
  .status { text-align:center; color:var(--muted); padding:28px 0; }
  .status.error { color:var(--err); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; margin-top:14px; }
  #search { display:block; width:100%; margin:0 0 14px; padding:10px 14px; border-radius:8px; border:2px solid #2b3a57;
            background:var(--panel); color:var(--text); font:inherit; }
  #search:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#08111f; border:0; border-radius:6px; padding:6px 14px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>DATABASE</h1>
  <p class="sub">Table: leaderboard (all rows, newest first)</p>
  <input id="search" type="search" placeholder="Search by nickname, skin or date…" autocomplete="off">
  <div class="panel">
    <table>
      <thead><tr>
        <th class="num">id</th><th>nickname</th><th class="num">total_time</th>
        <th class="num">coins</th><th>skin</th><th>played_on</th><th>created_at</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="status" class="status">Loading…</div>
  </div>
  <footer>
    <span id="updated"></span>
    <button id="refresh" type="button">Refresh</button>
  </footer>
</main>

<script>
  // The page is served by the API itself, so the URL is relative (same server and port).
  const API_URL = "/api/db";   // every row of the database table
  const REFRESH_MS = 15000;

  const rowsEl = document.getElementById("rows");
  const statusEl = document.getElementById("status");
  const updatedEl = document.getElementById("updated");

  function cell(text, className) {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text;       // textContent: nicknames are user input, so never insert them as HTML
    return td;
  }

  let allResults = [];

  function render(results) {
    rowsEl.replaceChildren();
    if (!results.length) {
      statusEl.textContent = allResults.length ? "No rows match your search." : "The table is empty.";
      statusEl.className = "status";
      statusEl.hidden = false;
      return;
    }
    statusEl.hidden = true;
    results.forEach((row) => {
      const tr = document.createElement("tr");
      tr.append(
        cell(row.id, "num"),
        cell(row.nickname),
        cell(Number(row.total_time).toFixed(2), "num"),
        cell(row.coins, "num"),
        cell(row.skin),
        cell(row.played_on),
        cell(row.created_at)
      );
      rowsEl.append(tr);
    });
  }

  async function load() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      allResults = data.rows || [];
      applyFilter();
      updatedEl.textContent = allResults.length + " rows · Updated: " + new Date().toLocaleTimeString() + " · ";
    } catch (err) {
      rowsEl.replaceChildren();
      statusEl.textContent = "Failed to load data: " + err.message;
      statusEl.className = "status error";
      statusEl.hidden = false;
    }
  }

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    render(q ? allResults.filter(r => [r.nickname, r.skin, r.played_on].some(v => String(v).toLowerCase().includes(q))) : allResults);
  }

  const searchEl = document.getElementById("search");
  searchEl.addEventListener("input", applyFilter);
  document.getElementById("refresh").addEventListener("click", load);
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
